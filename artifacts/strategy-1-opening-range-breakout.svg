<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
<rect width="760" height="420" fill="#fff"/>
<text x="20" y="30" font-size="18" font-weight="bold">#1 Patrick Whelan - 15-min Opening Range (schematic)</text>
<rect x="110" y="140" width="150" height="90" fill="#e8f0fe" stroke="#4a78d4" stroke-dasharray="4"/>
<text x="115" y="132" font-size="12" fill="#4a78d4">Box = first 15-min candle (9:30 open)</text>
<line x1="110" y1="140" x2="700" y2="140" stroke="#4a78d4" stroke-dasharray="2"/>
<line x1="110" y1="230" x2="700" y2="230" stroke="#4a78d4" stroke-dasharray="2"/>
<g stroke="#222" stroke-width="2">
<line x1="150" y1="150" x2="150" y2="225"/><rect x="143" y="165" width="14" height="45" fill="#2a9d5c"/>
<line x1="210" y1="150" x2="210" y2="228"/><rect x="203" y="170" width="14" height="40" fill="#d64545"/>
<line x1="300" y1="95" x2="300" y2="160"/><rect x="293" y="105" width="14" height="45" fill="#2a9d5c"/>
<line x1="360" y1="80" x2="360" y2="125"/><rect x="353" y="88" width="14" height="30" fill="#2a9d5c"/>
<line x1="420" y1="60" x2="420" y2="105"/><rect x="413" y="68" width="14" height="30" fill="#2a9d5c"/>
<line x1="480" y1="50" x2="480" y2="90"/><rect x="473" y="58" width="14" height="25" fill="#2a9d5c"/>
</g>
<polyline points="300,200 360,160 420,120 480,95 560,85" fill="none" stroke="#e08a00" stroke-width="2.5"/>
<text x="500" y="115" font-size="12" fill="#e08a00">Trailing stop follows price</text>
<text x="310" y="180" font-size="12" fill="#2a9d5c">Entry: side that breaks the box</text>
<text x="20" y="290" font-size="14" font-weight="bold">Rules (as stated in the video)</text>
<text x="20" y="315" font-size="13">1. Mark the 9:30 first 15-minute candle (high and low).</text>
<text x="20" y="338" font-size="13">2. Trade whichever side breaks (up = long, down = short).</text>
<text x="20" y="361" font-size="13">3. Trail the stop.</text>
<text x="20" y="390" font-size="11" fill="#666">Result: +130R across 3 markets, the only profitable one on all. Stop placement/trail method not specified in the video.</text>
</svg>
