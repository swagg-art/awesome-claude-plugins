[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "native-mt5"
version = "0.1.0"
description = "Native MetaTrader 5 access for AI agents, over MCP — market data, account state, position sizing and guarded order execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "metatrader", "mt5", "trading", "claude", "forex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
server = ["mcp>=1.2.0"]
terminal = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
native-mt5 = "native_mt5.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/native_mt5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
