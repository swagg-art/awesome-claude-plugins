[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liquid-assistant"
version = "0.1.0"
description = "Risk arithmetic for trading Liquid perpetuals with a human in the loop: sizing from a risk budget, leverage that keeps liquidation beyond the stop, funding costs, portfolio review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["trading", "perpetuals", "risk", "position-sizing", "liquidation"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/liquid_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
